<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PECoG Lab Booking</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--ink:#1f2933;--muted:#6b7280;--line:#e2e8f0;
--brand:#1f6f8b;--brand-d:#155263;--confirmed:#2f855a;--confirmed-bg:#e6f4ec;
--planned:#b7791f;--planned-bg:#fdf6e3;--conflict:#c53030;--conflict-bg:#fdecec;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--brand);color:#fff;padding:13px 20px;display:flex;align-items:center;gap:14px}
header img{height:46px;background:#fff;padding:5px 9px;border-radius:9px}
header h1{margin:0;font-size:18px}header .sub{opacity:.85;font-size:12px}
#whoami{font-size:12px;opacity:.9;margin-right:8px}
#logout{display:none;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer}
.wrap{max-width:1300px;margin:0 auto;padding:16px 20px 60px}
.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.nav{display:flex;align-items:center;gap:8px}
.nav button{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;font-size:17px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:not-allowed}
.nav .label{font-weight:600;min-width:220px;text-align:center}
.spacer{flex:1}
.filt{display:flex;flex-direction:column;gap:3px}
.filt label{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.filt select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.stats{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:110px}
.stat .n{font-size:20px;font-weight:700}.stat.warn .n{color:var(--conflict)}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase}
.cal{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.calhead{display:grid;grid-template-columns:60px repeat(5,1fr);border-bottom:1px solid var(--line)}
.calhead div{padding:8px 6px;text-align:center;font-size:12.5px;border-left:1px solid var(--line)}
.calhead div:first-child{border-left:0}
.calhead .dn{font-weight:600}.calhead .dd{color:var(--muted);font-size:11.5px}
.calhead .today{background:var(--confirmed-bg)}
.grid{display:grid;grid-template-columns:60px repeat(5,1fr)}
.axis .h{height:48px;font-size:10.5px;color:var(--muted);text-align:right;padding:2px 5px 0 0;border-top:1px solid var(--line)}
.daycol{position:relative;border-left:1px solid var(--line)}
.daycol .h{height:48px;border-top:1px solid var(--line)}
.block{position:absolute;border-radius:6px;padding:3px 5px;font-size:11px;overflow:hidden;border-left:4px solid var(--muted);background:#f1f5f9}
.block{cursor:pointer}.block .t{font-weight:600;line-height:1.15}.block .m{color:var(--muted);font-size:10px}
.block .eq{font-size:10px;color:var(--ink);opacity:.78;margin-top:2px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#dEquip li{font-size:13px;margin-bottom:3px}
.block.confirmed{border-left-color:var(--confirmed);background:var(--confirmed-bg)}
.block.planned{border-left-color:var(--planned);background:var(--planned-bg)}
.block.conflict{border-left-color:var(--conflict);background:var(--conflict-bg);box-shadow:0 0 0 1px var(--conflict) inset}
.block .del{position:absolute;top:1px;right:3px;color:var(--muted);cursor:pointer;font-size:12px;display:none}
.block:hover .del{display:block}
h2{font-size:15px;margin:20px 0 10px}
.conf{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--conflict);border-radius:9px;padding:11px 13px;margin-bottom:9px}
.conf .hd{font-weight:600;color:var(--conflict);margin-bottom:5px}
.conf .p{font-size:13px;padding:3px 0;border-top:1px dashed var(--line)}
.conf .p:first-of-type{border-top:0}.yield{color:var(--conflict);font-weight:600}.keep{color:var(--confirmed);font-weight:600}
.none{color:var(--muted);padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:9px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span{display:inline-flex;gap:5px;align-items:center}.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:40}
.mask.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:20px 22px;width:520px;max-width:100%}
.modal h3{margin:0 0 14px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.f label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.f input,.f select{padding:8px 10px;border:1px solid var(--line);border-radius:7px}
.f select[multiple]{height:120px}
.row2{display:flex;gap:11px}.row2 .f{flex:1}
.consent{display:flex;gap:9px;align-items:flex-start;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12.5px}
.consent input{margin-top:2px}
.err{color:var(--conflict);font-size:13px;margin-bottom:10px;min-height:16px}
.actions{display:flex;justify-content:flex-end;gap:10px}
.loginmask{position:fixed;inset:0;background:rgba(15,32,39,.55);display:none;align-items:center;justify-content:center;z-index:50}
.loginmask.open{display:flex}
.loginbox{background:#fff;border-radius:12px;padding:26px 28px;width:340px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.loginbox h3{margin:0 0 4px;color:var(--brand-d)}.loginbox p{margin:0 0 16px;color:var(--muted);font-size:12.5px}
.loginbox label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:4px}
.loginbox input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;font-size:14px}
.loginbox button{width:100%;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px;font-weight:600;cursor:pointer}
.loginerr{color:var(--conflict);font-size:12.5px;min-height:16px;margin-bottom:8px}
</style>
</head>
<body>
<header>
  <img id="logo" alt="PECoG">
  <div><h1>PECoG Lab — Booking</h1></div>
  <div class="spacer"></div>
  <span id="whoami"></span>
  <button id="logout">Log out</button>
</header>
<div class="wrap">
  <div class="toolbar">
    <div class="nav"><button id="prev" title="Previous week">&lsaquo;</button><div class="label" id="weeklabel">—</div><button id="next" title="Next week">&rsaquo;</button></div>
    <button class="btn" id="newbtn">+ New booking</button>
    <div class="spacer"></div>
    <div class="filt"><label>Room</label><select id="fRoom"><option value="">All rooms</option></select></div>
    <div class="filt"><label>Equipment</label><select id="fEquip"><option value="">All equipment</option></select></div>
    <div class="filt"><label>Status</label><select id="fStatus"><option value="">All</option><option value="confirmed">Confirmed</option><option value="planned">Planned</option></select></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="cal"><div class="calhead" id="calhead"></div><div class="grid" id="grid"></div></div>
  <div class="legend">
    <span><span class="sw" style="background:var(--confirmed)"></span>Confirmed (priority)</span>
    <span><span class="sw" style="background:var(--planned)"></span>Planned</span>
    <span><span class="sw" style="background:var(--conflict)"></span>Conflict — same resource, overlapping time</span>
  </div>
  <h2>Conflicts &amp; priority</h2>
  <div id="conflicts"></div>
</div>

<div class="mask" id="mask"><div class="modal">
  <h3>New booking</h3>
  <div class="err" id="merr"></div>
  <div class="row2"><div class="f"><label>Experimenter name *</label><input id="mExp"></div>
    <div class="f"><label>Experiment name *</label><input id="mExpName"></div></div>
  <div class="f"><label>Main researcher(s)</label><input id="mMain" placeholder="e.g. Martin Fischer"></div>
  <div class="row2"><div class="f"><label>Date *</label><input type="date" id="mDate"></div>
    <div class="f"><label>Start *</label><input type="time" id="mStart" step="900" value="09:00"></div>
    <div class="f"><label>End *</label><input type="time" id="mEnd" step="900" value="11:00"></div></div>
  <div class="f"><label>Booking status *</label><select id="mStatus"></select></div>
  <div class="f"><label>Room</label><select id="mRoom"></select></div>
  <div class="f"><label>Equipment (Ctrl/Cmd-click for several)</label><select id="mEquip" multiple></select></div>
  <div class="f"><label>Email *</label><input id="mEmail" type="email" placeholder="you@uni-potsdam.de"></div>
  <label class="consent"><input type="checkbox" id="mConsent">
    <span>I agree that my email is stored in the lab booking system so I can be notified about
    scheduling conflicts. I can ask the lab manager to remove it at any time.</span></label>
  <div class="actions"><button class="btn ghost" id="cancel">Cancel</button><button class="btn" id="save">Save booking</button></div>
</div></div>

<div class="mask" id="dmask"><div class="modal">
  <h3 id="dTitle">Booking</h3>
  <div id="dMeta" style="font-size:13px;line-height:1.7;margin-bottom:12px"></div>
  <div style="font-weight:600;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px">Equipment reserved</div>
  <ul id="dEquip" style="margin:0 0 16px 18px;padding:0"></ul>
  <div class="actions">
    <button class="btn ghost" id="dClose">Close</button>
    <button class="btn ghost" id="dEdit" style="display:none">Edit</button>
    <button class="btn" id="dDelete" style="display:none;background:var(--conflict)">Delete</button>
  </div>
</div></div>
<div class="loginmask" id="loginmask"><div class="loginbox">
  <h3>PECoG Lab Booking</h3><p>Sign in with your lab login.</p>
  <div class="loginerr" id="loginerr"></div>
  <label>Username</label><input id="luser" autocomplete="username">
  <label>Password</label><input id="lpass" type="password" autocomplete="current-password">
  <button id="lbtn">Sign in</button>
</div></div>

<script>
/* ===== CONFIG ===== */
const DATA_URL = "https://script.google.com/macros/s/AKfycbx75BeaK8lhu6fqnCpi1NtMkf_E9tO_y75R4oNRbRoRkdoRFLgviBIhdZJ70EXXdYXT3Q/exec";        /* Apps Script /exec URL. "" = demo mode (sample data, no login) */
const POLL_SECONDS = 30;

const ROOMS=["VR LAB (6.03)","Grip Force (5.35)","Touch Screen Room (5.04)","No room"];
const STATUSES=["Confirmed Participant (via SONA)","Confirmed Participant (internal)","Planned (Awaiting Participant)"];
const EQUIPMENT={
 "VR LAB (6.03)":["NAO Robot","Navel Robot","Furhat Robot","VR headset","VR computer","Respiration belt 1","Respiration belt 2","Experiment Laptop 1","Experiment Laptop 2"],
 "Grip Force (5.35)":["EEG (eego32 amplifier + Tablet)","Grip sensors","Biopac (EMG + EDA)","Grip sensors computer","Stimuli Computer","Experiment Laptop 3"],
 "Touch Screen Room (5.04)":["Touch screen","Cameras","Microphone","Touch screen computer","Wireless mouse + keyboard","Experiment Laptop 4"]};
const ALLEQ=[...new Set(Object.values(EQUIPMENT).flat())].sort();

const START_MIN=420,END_MIN=1140,PXMIN=48/60;
const DAYS=["Mon","Tue","Wed","Thu","Fri"], MAX_AHEAD=2, MAX_BACK=4;
const DEMO=!DATA_URL;
let weekOffset=0, DATA={bookings:[]};
let ME={user:"",role:"user"}, editId=null;

const el=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
function mondayOf(d){const x=new Date(d);const g=(x.getDay()+6)%7;x.setDate(x.getDate()-g);x.setHours(0,0,0,0);return x;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function toMin(t){const p=String(t).split(":");return (+p[0])*60+(+p[1]);}
function confirmed(s){return String(s).toLowerCase().includes("confirmed");}
function normEq(n){return String(n).replace(/ \((VR Lab|Grip Force Lab|Touch Screen Lab)\)$/,"").trim();}
function resourcesOf(b){const s=new Set();if(b.room&&b.room!=="No room")s.add(b.room);String(b.equipment||"").split(",").forEach(e=>{e=normEq(e.trim());if(e)s.add(e);});return s;}
function overlap(a,b){return a.date===b.date&&String(a.start)<String(b.end)&&String(b.start)<String(a.end);}
function detect(rows){const out=[],seen={};for(let i=0;i<rows.length;i++)for(let j=i+1;j<rows.length;j++){const a=rows[i],b=rows[j];if(!overlap(a,b))continue;const ra=resourcesOf(a),rb=resourcesOf(b);ra.forEach(res=>{if(!rb.has(res))return;const key=[a.id,b.id].sort().join("-")+"|"+res;if(seen[key])return;seen[key]=1;out.push({resource:res,date:a.date,a:a.id,b:b.id,parties:[a,b]});});}return out;}

/* ===== auth/token ===== */
const TKEY="pecog_token";
const getTok=()=>{try{return localStorage.getItem(TKEY)||"";}catch(e){return "";}};
const setTok=t=>{try{localStorage.setItem(TKEY,t);}catch(e){}};
const clrTok=()=>{try{localStorage.removeItem(TKEY);}catch(e){}};
function authUrl(extra){return DATA_URL+(DATA_URL.indexOf("?")>-1?"&":"?")+"token="+encodeURIComponent(getTok())+(extra?("&"+extra):"");}
function showLogin(m){el("loginerr").textContent=m||"";el("loginmask").classList.add("open");el("logout").style.display="none";}
function hideLogin(){el("loginmask").classList.remove("open");el("logout").style.display="inline-block";}

/* ===== selects ===== */
function initSelects(){
  ROOMS.filter(r=>r!=="No room").forEach(r=>el("fRoom").add(new Option(r,r)));
  ALLEQ.forEach(e=>el("fEquip").add(new Option(e,e)));
  STATUSES.forEach(s=>el("mStatus").add(new Option(s,s)));
  ROOMS.forEach(r=>el("mRoom").add(new Option(r,r)));
  el("mRoom").onchange=fillEquip; fillEquip();
  [el("fRoom"),el("fEquip"),el("fStatus")].forEach(x=>x.onchange=()=>render(curMon()));
}
function fillEquip(){const room=el("mRoom").value;const sel=el("mEquip");sel.innerHTML="";
  (room&&room!=="No room"?EQUIPMENT[room]||[]:ALLEQ).forEach(x=>sel.add(new Option(x,x)));}

/* ===== data ===== */
function curMon(){return addDays(mondayOf(new Date()),weekOffset*7);}
let SAMPLE=[];
function buildSample(){const m=mondayOf(new Date());SAMPLE=[
 {id:1,experimenter:"Ana",experiment:"NAO study",main_researcher:"Martin Fischer",email:"ana@uni.de",status:"Confirmed Participant (via SONA)",room:"VR LAB (6.03)",equipment:"NAO Robot,VR headset",date:iso(m),start:"09:00",end:"11:00"},
 {id:2,experimenter:"Ben",experiment:"Mobile NAO",email:"ben@uni.de",status:"Planned (Awaiting Participant)",room:"No room",equipment:"NAO Robot (VR Lab)",date:iso(m),start:"10:00",end:"12:00"},
 {id:3,experimenter:"Cara",experiment:"Grip task",email:"cara@uni.de",status:"Planned (Awaiting Participant)",room:"Grip Force (5.35)",equipment:"EEG (eego32 amplifier + Tablet)",date:iso(addDays(m,2)),start:"13:00",end:"15:30"},
 {id:4,experimenter:"Dana",experiment:"Touch pilot",email:"dana@uni.de",status:"Confirmed Participant (internal)",room:"Touch Screen Room (5.04)",equipment:"Touch screen,Cameras",date:iso(addDays(m,3)),start:"07:30",end:"09:00"}];}
async function loadWeek(){
  const mon=curMon(),fri=addDays(mon,4);
  if(DEMO){ DATA={bookings:SAMPLE.filter(b=>b.date>=iso(mon)&&b.date<=iso(fri))}; render(mon); return; }
  try{
    const r=await fetch(authUrl("from="+iso(mon)+"&to="+iso(fri)));const j=await r.json();
    if(j.error==="auth"){clrTok();showLogin("Please sign in.");return;}
    DATA=j; if(j.me)ME=j.me; hideLogin(); render(mon); startPolling();
  }catch(e){ el("weeklabel").textContent="connection error"; }
}
let CURVER=null, POLLING=false;
function startPolling(){ if(DEMO||POLLING)return;POLLING=true;
  setInterval(()=>{fetch(authUrl("mode=version")).then(r=>r.json()).then(v=>{
    if(v.error==="auth"){clrTok();showLogin();return;}
    if(v.version!=null&&String(v.version)!==String(CURVER)){CURVER=v.version;loadWeek();}}).catch(()=>{});
  },POLL_SECONDS*1000);}

/* ===== render ===== */
function filters(){return {room:el("fRoom").value,eq:el("fEquip").value,st:el("fStatus").value};}
function bPass(b,f){return (!f.room||b.room===f.room)&&(!f.eq||resourcesOf(b).has(f.eq))&&(!f.st||(f.st==="confirmed"?confirmed(b.status):!confirmed(b.status)));}
function cPass(c,f){
  if(f.room&&!(c.resource===f.room||c.parties.some(p=>p.room===f.room)))return false;
  if(f.eq&&c.resource!==f.eq)return false;
  if(f.st&&!c.parties.some(p=>f.st==="confirmed"?confirmed(p.status):!confirmed(p.status)))return false;
  return true;}
function render(mon){
  if(CURVER==null&&DATA.version!=null)CURVER=DATA.version;
  const f=filters(),today=iso(new Date());
  let hh='<div></div>';
  DAYS.forEach((d,i)=>{const dt=addDays(mon,i);const is=iso(dt)===today?" today":"";
    hh+='<div class="'+is+'"><div class="dn">'+d+'</div><div class="dd">'+pad(dt.getDate())+' '+dt.toLocaleString('en',{month:'short'})+'</div></div>';});
  el("calhead").innerHTML=hh;
  el("weeklabel").textContent=pad(mon.getDate())+' '+mon.toLocaleString('en',{month:'short'})+' – '+pad(addDays(mon,4).getDate())+' '+addDays(mon,4).toLocaleString('en',{month:'short'})+' '+addDays(mon,4).getFullYear();
  const all=(DATA.bookings||[]);
  const conf=detect(all).filter(c=>cPass(c,f));
  const cids=new Set();conf.forEach(c=>{cids.add(c.a);cids.add(c.b);});
  let g='<div class="axis">';for(let m=START_MIN;m<END_MIN;m+=60)g+='<div class="h">'+pad(m/60|0)+':00</div>';g+='</div>';
  const byDay={};DAYS.forEach((_,i)=>byDay[iso(addDays(mon,i))]=[]);
  all.filter(b=>bPass(b,f)).forEach(b=>{if(byDay[b.date])byDay[b.date].push(b);});
  DAYS.forEach((_,i)=>{
    const date=iso(addDays(mon,i));const list=byDay[date].slice().sort((a,b)=>toMin(a.start)-toMin(b.start));
    const laneEnd=[];list.forEach(b=>{let ln=0;while(ln<laneEnd.length&&laneEnd[ln]>toMin(b.start))ln++;laneEnd[ln]=toMin(b.end);b._lane=ln;});
    const nL=Math.max(1,laneEnd.length);
    g+='<div class="daycol">';for(let m=START_MIN;m<END_MIN;m+=60)g+='<div class="h"></div>';
    list.forEach(b=>{const top=(toMin(b.start)-START_MIN)*PXMIN,hgt=Math.max(16,(toMin(b.end)-toMin(b.start))*PXMIN-2);
      const w=96/nL,left=2+b._lane*w,cf=cids.has(b.id);
      const cls=cf?"conflict":(confirmed(b.status)?"confirmed":"planned");
      const adminMail=(ME.role==="admin"&&b.email)?(" · "+b.email):"";
      const eqs=String(b.equipment||"").split(",").map(x=>x.trim()).filter(Boolean);
      g+='<div class="block '+cls+'" data-id="'+b.id+'" style="top:'+top+'px;height:'+hgt+'px;left:'+left+'%;width:'+w+'%" title="Click for details">'+
        '<div class="t">'+b.start+' '+b.experiment+'</div><div class="m">'+b.experimenter+' · '+b.room+adminMail+'</div>'+
        (eqs.length?'<div class="eq">'+eqs.join(", ")+'</div>':'')+'</div>';});
    g+='</div>';});
  el("grid").innerHTML=g;
  el("grid").querySelectorAll(".block").forEach(bl=>bl.onclick=()=>{const b=(DATA.bookings||[]).find(x=>String(x.id)===String(bl.dataset.id));if(b)showDetails(b);});
  const vis=all.filter(b=>bPass(b,f)),cN=vis.filter(b=>confirmed(b.status)).length;
  el("stats").innerHTML=[["Bookings",vis.length,""],["Confirmed",cN,""],["Planned",vis.length-cN,""],["Conflicts",conf.length,"warn"]]
    .map(a=>'<div class="stat '+a[2]+'"><div class="n">'+a[1]+'</div><div class="l">'+a[0]+'</div></div>').join("");
  const cp=el("conflicts"),allConf=detect(all);
  if(!allConf.length)cp.innerHTML='<div class="none">No conflicts this week. ✅</div>';
  else if(!conf.length)cp.innerHTML='<div class="none">No conflicts for this filter ('+allConf.length+' total this week).</div>';
  else cp.innerHTML=conf.map(c=>{const anyC=c.parties.some(p=>confirmed(p.status));
    const ps=c.parties.map(p=>{let t="";if(anyC&&!confirmed(p.status))t=' <span class="yield">→ must yield</span>';else if(confirmed(p.status))t=' <span class="keep">→ priority</span>';
      return '<div class="p"><b>'+p.experiment+'</b> — '+p.experimenter+' ('+p.email+') · '+p.start+'-'+p.end+t+'</div>';}).join("");
    return '<div class="conf"><div class="hd">⚠ '+c.resource+' · '+c.date+'</div>'+ps+'</div>';}).join("");
}

/* ===== actions ===== */
async function delBooking(id){if(!confirm("Delete this booking?"))return;
  if(DEMO){SAMPLE=SAMPLE.filter(b=>String(b.id)!==String(id));return loadWeek();}
  const r=await fetch(DATA_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"delete",id:id,token:getTok()})});
  const j=await r.json().catch(()=>({}));
  if(j && j.error){ if(j.error==="auth"){clrTok();showLogin();} else alert(j.error); return; }
  loadWeek();}

el("prev").onclick=()=>{if(weekOffset>-MAX_BACK){weekOffset--;updateNav();loadWeek();}};
el("next").onclick=()=>{if(weekOffset<MAX_AHEAD){weekOffset++;updateNav();loadWeek();}};
function updateNav(){el("prev").disabled=weekOffset<=-MAX_BACK;el("next").disabled=weekOffset>=MAX_AHEAD;}

el("newbtn").onclick=()=>{editId=null;el("merr").textContent="";clearForm();
  document.querySelector("#mask .modal h3").textContent="New booking";
  const mon=curMon();el("mDate").value=iso(mon);el("mDate").min=iso(addDays(mondayOf(new Date()),-MAX_BACK*7));
  el("mDate").max=iso(addDays(mondayOf(new Date()),MAX_AHEAD*7+4));el("mRoom").value="No room";fillEquip();el("mask").classList.add("open");};
function openEditById(id){const b=(DATA.bookings||[]).find(x=>String(x.id)===String(id));if(b)openEdit(b);}
function openEdit(b){editId=b.id;el("merr").textContent="";
  document.querySelector("#mask .modal h3").textContent="Edit booking";
  el("mExp").value=b.experimenter||"";el("mExpName").value=b.experiment||"";el("mMain").value=b.main_researcher||"";
  el("mDate").value=b.date||"";el("mStart").value=b.start||"";el("mEnd").value=b.end||"";
  el("mStatus").value=b.status||STATUSES[0];el("mRoom").value=b.room||"No room";fillEquip();
  const want=String(b.equipment||"").split(",").map(x=>x.trim());
  [...el("mEquip").options].forEach(o=>o.selected=want.indexOf(o.value)>-1);
  el("mEmail").value=b.email||"";el("mConsent").checked=true;el("mask").classList.add("open");}
el("cancel").onclick=()=>el("mask").classList.remove("open");
el("mask").onclick=e=>{if(e.target===el("mask"))el("mask").classList.remove("open");};
let DETAIL=null;
function showDetails(b){DETAIL=b;
  el("dTitle").textContent=b.experiment||"Booking";
  var meta='<b>Who:</b> '+(b.experimenter||'')+'<br><b>When:</b> '+b.date+', '+b.start+'–'+b.end+'<br><b>Room:</b> '+(b.room||'')+'<br><b>Status:</b> '+(b.status||'');
  if(b.main_researcher) meta+='<br><b>Main researcher:</b> '+b.main_researcher;
  if(ME.role==="admin"&&b.email) meta+='<br><b>Email:</b> '+b.email;
  el("dMeta").innerHTML=meta;
  var eqs=String(b.equipment||"").split(",").map(x=>x.trim()).filter(Boolean);
  el("dEquip").innerHTML=eqs.length?eqs.map(e=>'<li>'+e+'</li>').join(""):'<li style="list-style:none;color:var(--muted)">(none)</li>';
  var canMod=(ME.role==="admin")||(String(b.created_by||"")===ME.user);
  el("dEdit").style.display=canMod?"inline-block":"none";
  el("dDelete").style.display=canMod?"inline-block":"none";
  el("dmask").classList.add("open");}
el("dClose").onclick=()=>el("dmask").classList.remove("open");
el("dmask").onclick=e=>{if(e.target===el("dmask"))el("dmask").classList.remove("open");};
el("dEdit").onclick=()=>{el("dmask").classList.remove("open");openEdit(DETAIL);};
el("dDelete").onclick=()=>{el("dmask").classList.remove("open");delBooking(DETAIL.id);};
el("save").onclick=async()=>{
  const eq=[...el("mEquip").selectedOptions].map(o=>o.value);
  const b={experimenter:el("mExp").value,experiment:el("mExpName").value,main_researcher:el("mMain").value,
    date:el("mDate").value,start:el("mStart").value,end:el("mEnd").value,status:el("mStatus").value,
    room:el("mRoom").value,equipment:eq,email:el("mEmail").value,email_consent:el("mConsent").checked};
  if(!b.experimenter||!b.experiment||!b.email||!b.status){el("merr").textContent="Please fill the required (*) fields.";return;}
  if(!b.email_consent){el("merr").textContent="Email consent is required.";return;}
  if(b.start>=b.end){el("merr").textContent="End must be after start.";return;}
  if(DEMO){
    if(editId){const t=SAMPLE.find(x=>String(x.id)===String(editId));if(t)Object.assign(t,b,{id:t.id,equipment:eq.join(",")});}
    else{b.id=Math.max(0,...SAMPLE.map(x=>x.id))+1;b.equipment=eq.join(",");b.created_by="demo";SAMPLE.push(b);}
    const nid=editId||b.id;editId=null;el("mask").classList.remove("open");clearForm();await loadWeek();
    if(detect(SAMPLE.filter(x=>x.date===b.date)).some(c=>c.a===nid||c.b===nid))alert("Saved — but this booking CONFLICTS (shown in red).");return; }
  const action=editId?"update":"create";
  const payload=Object.assign({},b,{action:action,token:getTok()});if(editId)payload.id=editId;
  const r=await fetch(DATA_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  const j=await r.json();
  if(j.error){el("merr").textContent=j.error==="auth"?"Session expired — sign in again.":j.error;if(j.error==="auth"){clrTok();showLogin();}return;}
  editId=null;el("mask").classList.remove("open");clearForm();await loadWeek();
  if(j.conflicts&&j.conflicts.length)alert("Saved — but this booking CONFLICTS with an existing one (shown in red). Please coordinate or adjust.");};
function clearForm(){["mExp","mExpName","mMain","mEmail"].forEach(i=>el(i).value="");el("mConsent").checked=false;}

/* ===== login ===== */
function doLogin(){const user=el("luser").value.trim(),pass=el("lpass").value;
  if(!user||!pass){el("loginerr").textContent="Enter username and password.";return;}
  el("loginerr").textContent="Signing in…";
  fetch(DATA_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"login",user:user,pass:pass})})
   .then(r=>r.json()).then(j=>{if(j.token){setTok(j.token);el("lpass").value="";el("whoami").textContent=j.user+(j.role==="admin"?" (admin)":"");loadWeek();}
     else el("loginerr").textContent=j.error||"Login failed";}).catch(()=>el("loginerr").textContent="Could not reach the server.");}
el("lbtn").onclick=doLogin;
el("lpass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
el("logout").onclick=()=>{clrTok();location.reload();};
